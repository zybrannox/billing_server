# Install once:  pip install pre-commit && pre-commit install
# Blocks a commit that contains a secret or a private key before it ever
# reaches git history (where removing it is far harder than not adding it).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2048"]
