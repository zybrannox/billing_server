# Secret scanning rules (https://github.com/gitleaks/gitleaks). Extends the
# default ruleset (AWS/GCP keys, private keys, tokens, ...) with the secrets
# this project actually handles.
title = "zybrannox secret scanning"

[extend]
useDefault = true

[[rules]]
id = "gmail-app-password"
description = "Gmail app password assigned in a config/env-style line"
regex = '''(?i)gmail_app_password\s*[=:]\s*["']?[a-z]{4}\s?[a-z]{4}\s?[a-z]{4}\s?[a-z]{4}["']?'''
tags = ["gmail", "smtp"]

[[rules]]
id = "jwt-signing-key-assignment"
description = "SECRET_KEY / CLIENT_SECRET_KEY assigned a literal value"
regex = '''(?i)(?:client_)?secret_key\s*[=:]\s*["']?[A-Za-z0-9_\-+/=]{24,}["']?'''
tags = ["jwt"]

[allowlist]
description = "Template and test files hold placeholders, never real values"
paths = ['''\.env\.example$''', '''^tests/''']
